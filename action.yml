name: 'Setup Nimbus'
description: 'Install the Nimbus CLI — run Salesforce Apex tests locally in CI. No org, no scratch-org pool, no Docker, no JVM.'
author: 'Nimbus Solutions'
branding:
  icon: 'cloud-lightning'
  color: 'gray-dark'

inputs:
  version:
    description: 'Nimbus version to install (e.g. "1.1.12"), or "latest".'
    required: false
    default: 'latest'

outputs:
  version:
    description: 'The Nimbus version that was installed.'
    value: ${{ steps.install.outputs.version || steps.install-windows.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install Nimbus (Linux/macOS)
      id: install
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        # Transient network/write hiccups on hosted runners are common; retry
        # every fetch rather than fail the whole job on a single blip.
        CURL="curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 30"

        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          # Buffer the whole API response first, THEN parse it. Piping curl
          # straight into `grep -m1` lets grep close the pipe on the first
          # match, which SIGPIPEs curl mid-write → curl exit 23 under pipefail.
          RELEASE_JSON="$($CURL https://api.github.com/repos/nimbus-solution/nimbus/releases/latest)"
          VERSION="$(printf '%s\n' "$RELEASE_JSON" | grep -m1 '"tag_name"' | sed -E 's/.*"v?([^"]+)".*/\1/')"
        fi
        VERSION="${VERSION#v}"
        if [ -z "$VERSION" ]; then
          echo "Could not determine Nimbus version to install." >&2
          exit 1
        fi

        case "$RUNNER_OS" in
          Linux)  OS=linux ;;
          macOS)  OS=darwin ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *) echo "Unsupported architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        ASSET="nimbus_${VERSION}_${OS}_${ARCH}.tar.gz"
        BASE="https://github.com/nimbus-solution/nimbus/releases/download/v${VERSION}"
        DEST="$RUNNER_TEMP/nimbus-${VERSION}"
        mkdir -p "$DEST"

        echo "Downloading nimbus v${VERSION} (${OS}/${ARCH})..."
        $CURL -o "$DEST/$ASSET" "$BASE/$ASSET"
        $CURL -o "$DEST/checksums.txt" "$BASE/checksums.txt"

        cd "$DEST"
        if command -v sha256sum >/dev/null 2>&1; then
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -
        else
          grep " ${ASSET}\$" checksums.txt | shasum -a 256 -c -
        fi

        tar -xzf "$ASSET"
        chmod +x nimbus
        echo "$DEST" >> "$GITHUB_PATH"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Installed: $("$DEST/nimbus" --version)"

    - name: Install Nimbus (Windows)
      id: install-windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $Version = '${{ inputs.version }}'
        if ($Version -eq 'latest') {
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/nimbus-solution/nimbus/releases/latest' -MaximumRetryCount 5 -RetryIntervalSec 2
          $Version = $release.tag_name
        }
        $Version = $Version.TrimStart('v')

        $Arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'amd64' }
        $Asset = "nimbus_${Version}_windows_${Arch}.zip"
        $Base = "https://github.com/nimbus-solution/nimbus/releases/download/v${Version}"
        $Dest = Join-Path $env:RUNNER_TEMP "nimbus-${Version}"
        New-Item -ItemType Directory -Force -Path $Dest | Out-Null

        Write-Host "Downloading nimbus v${Version} (windows/${Arch})..."
        Invoke-WebRequest -Uri "$Base/$Asset" -OutFile (Join-Path $Dest $Asset) -MaximumRetryCount 5 -RetryIntervalSec 2
        Invoke-WebRequest -Uri "$Base/checksums.txt" -OutFile (Join-Path $Dest 'checksums.txt') -MaximumRetryCount 5 -RetryIntervalSec 2

        $expected = (Select-String -Path (Join-Path $Dest 'checksums.txt') -Pattern ([regex]::Escape($Asset))).Line.Split(' ')[0]
        $actual = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $Dest $Asset)).Hash.ToLower()
        if ($expected -ne $actual) {
          Write-Error "Checksum mismatch for ${Asset}: expected $expected, got $actual"
          exit 1
        }

        Expand-Archive -Path (Join-Path $Dest $Asset) -DestinationPath $Dest -Force
        Add-Content -Path $env:GITHUB_PATH -Value $Dest
        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$Version"
        & (Join-Path $Dest 'nimbus.exe') --version
