name: Test action

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install latest
        id: setup
        uses: ./

      - name: Verify install
        shell: bash
        run: |
          nimbus --version
          echo "Installed version: ${{ steps.setup.outputs.version }}"

  test-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          version: '1.1.12'

      - name: Verify pinned version
        run: nimbus --version | grep -F '1.1.12'
