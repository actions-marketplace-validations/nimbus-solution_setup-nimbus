name: Test action

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install latest
        id: setup
        uses: ./

      - name: Verify install
        shell: bash
        run: |
          renmy --version
          nimbus --version
          echo "Installed version: ${{ steps.setup.outputs.version }}"

  # 1.1.12 predates the renmy name: its archive holds only nimbus, so this is
  # the job that proves the action still provides both commands for it.
  test-pinned:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          version: '1.1.12'

      - name: Verify pinned version
        shell: bash
        run: |
          nimbus --version | grep -F '1.1.12'
          renmy --version | grep -F '1.1.12'
